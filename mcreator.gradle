repositories {
  exclusiveContent {
    forRepository {
      maven {
        name = 'GeckoLib'
        url = 'https://dl.cloudsmith.io/public/geckolib3/geckolib/maven/'
      }
    }
    filter {
      includeGroupAndSubgroups('com.geckolib')
    }
  }
}

dependencies {
  implementation 'com.geckolib:geckolib-neoforge-26.2:5.5.6'
  interfaceInjectionData 'com.geckolib:geckolib-neoforge-26.2:5.5.6'
}


